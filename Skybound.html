<style>

.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:#fff;border:2px solid var(--mist);border-bottom:4px solid var(--mist);color:var(--deep)}
.btn.warn{background:var(--coral);border-bottom-color:#d94f4f}
.btn.block{width:100%}
.empty{text-align:center;padding:10px 6px 4px}
.empty p{margin:6px 0 14px}
.mascot{width:112px;height:112px;margin:0 auto;animation:bob 3.2s ease-in-out infinite}

.tab.plus svg{fill:var(--navy)}

.sc{background:#fff;width:min(100%,520px);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}

.acts{display:flex;gap:10px;margin-top:16px}.acts>*{flex:1}
.sect{margin:18px 16px 4px;font-size:15px;font-weight:900;color:#4a6584}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--cloud)}
.line:first-of-type{border-top:0}.line .t{flex:1}
.welcome{padding:28px 16px}.welcome h1{font-size:34px;font-weight:900;text-align:center;margin-top:8px}
.welcome>p{text-align:center;margin:6px 0 18px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.pick .tile{width:auto}
.btn svg{width:22px;height:22px;fill:var(--navy)}.goal .big{font:inherit;color:inherit;cursor:pointer;min-height:44px;display:block}.flow{position:fixed;inset:0;z-index:50;background:var(--cloud);display:none;padding-top:env(safe-area-inset-top,0px)}.flow.open{display:flex}.fi{width:min(100%,520px);margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}.ft{display:flex;align-items:center;gap:8px;padding:10px 12px}.ft .bar{flex:1;margin:0;height:16px}.fb{flex:1;overflow:auto;padding:8px 16px}.ff{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--mist);background:#fff}.hint{display:flex;gap:10px;align-items:center;margin-bottom:14px}.hint .mascot{width:68px;height:68px;flex:none;animation:none;margin:0}.bubble{background:#fff;border:2px solid var(--mist);border-radius:16px;padding:10px 14px;font-size:15px}.frow{background:#fff;border:2px solid var(--mist);border-radius:16px;padding:12px;margin-bottom:10px}.mb{height:8px;margin:6px 0 0}.dc svg{width:18px;height:18px;fill:var(--navy)}#cele{position:fixed;inset:0;z-index:70;background:rgba(15,42,74,.55);display:none;align-items:center;justify-content:center;padding:20px}#cele.open{display:flex}.cc{position:relative;overflow:hidden;background:#fff;border-radius:24px;padding:24px 20px;width:min(100%,380px);text-align:center}.cc h2{margin:6px 0}.cc .btn{margin-top:14px}.cf{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(420px) rotate(240deg);opacity:0}}input[type=date],input[type=time],select{width:100%;font:inherit;font-weight:700;color:var(--navy);border:2px solid var(--mist);border-radius:14px;padding:12px;background:#fff}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.day{min-height:46px;border:2px solid transparent;border-radius:12px;background:none;font-weight:800;padding:0}.day i{display:block;width:6px;height:6px;border-radius:50%;margin:2px auto 0}.day[aria-pressed=true]{background:var(--cloud);border-color:var(--sky)}.fbk{border-left:5px solid var(--mist);background:var(--cloud);padding:8px 12px;border-radius:0 12px 12px 0;margin:8px 0;overflow-wrap:anywhere}

const DG=['One self-contained file: vanilla HTML, CSS and JS. Data lives in localStorage under skybound.v1, with an in-memory fallback if storage is blocked.','State S: acts, goals, fb (feedback), ses (sessions), hab (habits), rec (records), ms (milestones), target, quiet, big, legacy. Every item except activities carries act, the id of its activity. Items with ex:1 are example data.','Actions: the A object. Any element with data-a="name:arg" calls A.name(arg), then render() runs unless the action returns 1.','Mascot: replace the mascot() function. Logo: the logo() function. Palette: CSS variables on :root.','AimUp migration: migrate() copies any localStorage key starting with aimup into S.legacy and never touches the originals. The real AimUp key names have not been checked, so legacy data is stored but not mapped into goals yet.','Altitude: a hidden points total (3 per completed goal, 2 per review action, 1 per session done and 1 per habit log) mapped to four named bands and a soft bar that only rises. No numbers, countdowns or levels are shown, on purpose. The formula is still a placeholder.','Milestones are not awarded while only example data exists.','Appearance: S.ap holds acc, font, r, lg and name. applyAp() sets CSS variables and body classes on every render. The widget view is an in-app screen, not a native widget.','Branding: edit only the BRAND block at the top of the script. The logo, mascot poses, icons and activity tiles are dropins. Users can also drop in a logo or mascot image under More, Appearance (S.ap.logoImg, S.ap.mascotImg). The storage key skybound.v1 is not in BRAND on purpose. Feel: SND maps sound names to [Hz, delay, length] notes and BRAND.sounds overrides them. Every mascot moment calls mascot(pose), so a BRAND mascot replaces them all. TIPS holds the per-screen mascot tips. Tour: the TS array holds [title, text, navigate function, selector to highlight]. Add a step by adding a row. The tour adds a temporary example activity if needed and removes it at the end when you already had your own data. A few colours are still hard-coded: muted text, inactive tab icons, the built-in bird.'];
function guideView(){const R2=(a)=>a.map(x=>`<div class='line' style='align-items:flex-start'><span class='t'><b>${nf(x[0])}</b><div class='muted' style='font-size:14px'>${nf(x[1])}</div></span></div>`).join('');return `<section class='card'><button class='btn ghost' data-a='sub:'>Back</button><h3 style='margin-top:12px'>User guide</h3><p>1. Record feedback from the plus button. 2. Turn it into goals, then tap Focus on up to three of them. Those become your Current Aim. 3. Do the next action, log sessions and habits, and review goals. 4. Add records when you are proud of something. 5. Back up from More now and then. The top bar shows your activity, a ring for this weeks sessions and habits (no streaks, rest days are fine), your focus goals and your next session.</p></section><section class='card'><h3>What is built</h3>${R2(ST)}</section><section class='card'><h3>Changelog</h3>${R2(CL)}</section>${ui.dev?`<section class='card'><h3>Developer guide</h3>${DG.map(x=>`<p style='margin-bottom:10px;overflow-wrap:anywhere'>${esc(x)}</p>`).join('')}</section>`:''}`}
Object.assign(A,{tfeat(){featSheet();return 1},rinc(k){repInit();R.i[k]=!R.i[k]},rcopy(){const t=repText();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>{$('rmsg').textContent='Copied.'},()=>cpy(t));else cpy(t);return 1},rprint(){try{window.print()}catch(e){$('rmsg').textContent='Printing is blocked here.'}return 1},
tour(){closeSheet();T={on:true,s:0,prev:S.cur,had:S.acts.some(a=>!a.ex),added:false};if(!S.acts.some(a=>a.ex)){exData();T.added=true}S.cur=S.acts.find(a=>a.ex).id;go(0)},tnext(){go(T.s+1)},tback(){go(T.s-1)},tend(){endTour()},
ex(){exData();ui.tab='home';ui.panel=false;save()},rmex(){confirmSheet('The example activity and everything in it will be deleted. Your own data is not touched.','Remove',()=>{const ids=S.acts.filter(a=>a.ex).map(a=>a.id);S.acts=S.acts.filter(a=>!a.ex);['goals','fb','ses','hab','rec'].forEach(k=>S[k]=S[k].filter(x=>!ids.includes(x.act)));S.cur=(S.acts[0]||{}).id||null;save()});return 1},
big(){S.big=!S.big;save()},devtap(){ui.dt=(ui.dt||0)+1;if(ui.dt>=5){ui.dev=true;ui.sub='guide'}}});

/* ===== F33 widget view, F35 appearance ===== */
const ACC=Object.assign({sky:[BRAND.colors.sky,BRAND.colors.deep,BRAND.colors.label]},BRAND.picker);
const ap=()=>Object.assign({acc:'sky',font:'nun',r:'round',lg:'bird',name:BRAND.name},S.ap||{});
const nm=()=>ap().name||BRAND.name;
function applyAp(){const a=ap(),c=ACC[a.acc]||ACC.sky,r=document.documentElement.style,b=document.body.classList;const k=BRAND.colors;['navy','cloud','mist'].forEach(x=>r.setProperty('--'+x,k[x]));Object.entries(k.accents).forEach(([x,v])=>r.setProperty('--'+x,v));r.setProperty('--fb','"'+BRAND.font.family+'"');if(BRAND.font.href&&!window._fl){window._fl=1;const l=document.createElement('link');l.rel='stylesheet';l.href=BRAND.font.href;document.head.appendChild(l)}r.setProperty('--sky',c[0]);r.setProperty('--deep',c[1]);b.toggle('f-sys',a.font==='sys');b.toggle('r-soft',a.r==='soft');b.toggle('r-sharp',a.r==='sharp');document.title=nm()}
function appView(){const a=ap(),B=(k,v,l)=>`<button data-a='ap:${k}:${v}' aria-pressed='${a[k]===v}'>${l}</button>`;return `<section class='card'><button class='btn ghost' data-a='sub:'>Back</button><h3 style='margin-top:12px'>Appearance</h3><label>Accent colour</label><div class='seg' style='flex-wrap:wrap'>${Object.keys(ACC).map(k=>`<button style='flex:1 0 28%' data-a='ap:acc:${k}' aria-pressed='${a.acc===k}'><span style='display:inline-block;width:14px;height:14px;border-radius:50%;background:${ACC[k][0]};margin-right:6px;vertical-align:-2px'></span>${ACC[k][2]}</button>`).join('')}</div><label>Font</label><div class='seg'>${B('font','nun','Nunito')}${B('font','sys','System')}</div><label>Corners</label><div class='seg'>${B('r','round','Round')}${B('r','soft','Soft')}${B('r','sharp','Sharp')}</div><label for='apn'>App name</label><input id='apn' type='text' maxlength='20' value='${esc(a.name)}'><label>Logo</label><div class='seg'>${B('lg','bird','Bird')}${B('lg','letter','Letter')}</div><label>Brand dropins</label><p class='muted' style='font-size:14px'>Drop in your own logo or mascot picture (PNG, SVG or JPG, under 300 KB). It stays on this device and is included in backups.</p><label for='lgf'>Logo image</label><input id='lgf' type='file' accept='image/*'>${a.logoImg?`<div class='acts' style='margin-top:8px'><button class='btn ghost' data-a='dropx:logoImg'>Remove logo image</button></div>`:''}<label for='mcf'>Mascot image</label><input id='mcf' type='file' accept='image/*'>${a.mascotImg?`<div class='acts' style='margin-top:8px'><button class='btn ghost' data-a='dropx:mascotImg'>Remove mascot image</button></div>`:''}<p id='dmsg' class='muted' role='status' style='font-size:14px'></p><div style='display:grid;place-items:center;margin:16px 0 4px'>${logo(64)}</div><div style='width:96px;margin:0 auto'>${mascot('hi')}</div><div class='acts'><button class='btn ghost' data-a='apreset'>Reset to the ${esc(BRAND.name)} look (removes dropped-in images)</button></div></section>`}
function widView(){const ar=aim(),n=nextSes(),a=act();return `<section class='card'><button class='btn ghost' data-a='sub:'>Back</button><p class='muted' style='font-size:14px;margin-top:10px'>A compact view of your focus. Tick a goal to complete it. This is an in-app view, not a phone widget.</p></section><section class='card' style='border:3px solid ${a.color}' aria-label='Widget: ${esc(a.name)}'><div class='line' style='border:0;padding-top:0'><span class='mini' style='background:${a.color}'>${ico(a.icon)}</span><b class='t'>${esc(a.name)}</b><span class='muted' style='font-size:14px'>${rhy()}/${S.target} this week</span></div><h3>Current Aim</h3>${ar.length?ar.map(g=>`<div class='goal'><button class='tick' data-a='done:${g.id}' aria-label='Mark done: ${esc(g.title)}'>${ico('check')}</button><div class='t'>${esc(g.title)}${g.na?`<div class='muted' style='font-size:14px'>Next: ${esc(g.na)}</div>`:''}</div></div>`).join(''):`<p class='muted'>No focus goals yet.</p>`}<h3 style='margin-top:12px'>Next session</h3><p>${n?esc(n.s.title)+', '+(n.i?fmt(n.k):'today')+(n.s.time?' at '+n.s.time:''):'None planned'}</p></section>`}
document.addEventListener('change',e=>{const k={lgf:'logoImg',mcf:'mascotImg'}[e.target.id],f=e.target.files&&e.target.files[0];if(!k||!f)return;if(!/^image\//.test(f.type)){$('dmsg').textContent='That is not an image.';return}if(f.size>307200){$('dmsg').textContent='That file is over 300 KB. Try a smaller one.';return}const r=new FileReader();r.onload=()=>{S.ap=Object.assign(ap(),{[k]:r.result});save();render()};r.readAsDataURL(f)});
Object.assign(A,{dropx(k){S.ap=Object.assign(ap(),{[k]:null});save()},ap(v){const [k,x]=v.split(':');S.ap=Object.assign(ap(),{[k]:x});save()},apreset(){S.ap=null;save()}});
document.addEventListener('change',e=>{if(e.target.id==='apn'&&!window._an){window._an=1;S.ap=Object.assign(ap(),{name:e.target.value.trim()||BRAND.name});save();try{render()}finally{window._an=0}}});

/* ===== Feel: sounds, toast, mascot tips ===== */
const SND=Object.assign({tap:[[640,0,.05]],ok:[[523,0,.09],[784,.07,.16]],undo:[[392,0,.08]],step:[[587,0,.07],[740,.05,.1]],cele:[[523,0,.14],[659,.1,.14],[784,.2,.14],[1047,.3,.3]]},BRAND.sounds||{});
let AC=null;
function snd(n){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t0=AC.currentTime;(SND[n]||[]).forEach(([f,d,l])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.1,t0+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d+l);o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+l+.02)})}catch(e){}}
const CHEER=['Nice one!','That counts.','Step by step.','Keep it gentle.','Good work.'];
function toast(m){const e=$('toast');e.innerHTML=`${mascot('cheer')}<span>${esc(m)}</span>`;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),2200)}
const TIPS={goals:['Tap the star to put a goal in your Current Aim. Three is plenty.','Big goal? Open it and break it into small steps.','Finished goals stay here, so you can look back at them.'],calendar:['Tap a day to see what happened, or add a session.','Weekly sessions repeat on their own.'],history:['Search any word from old feedback to find it again.','Looking back is part of making progress.'],more:['Back up now and then so nothing gets lost.','You can change how I look, or switch me off, any time.'],morerec:['Records are just for you. Add anything you’re proud of.'],morerep:['Pick a range, then copy the report to share with your coach.']};
const TC={};
function tipHtml(){if(S.quiet||T.on||ui.goal)return'';const k=ui.tab+(ui.sub||''),a=TIPS[k];if(!a||!a.length)return'';TC[k]=TC[k]||a[Math.floor(Math.random()*a.length)];return `<div class='hint' style='margin:12px 12px 0'>${mascot('hi')}<div class='bubble'>${TC[k]}</div></div>`}
Object.assign(A,{sound(){S.mute=!S.mute;save();if(!S.mute)snd('ok')}});
document.addEventListener('click',e=>{
  if(e.target===$('sheet')){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const [n,...r]=b.dataset.a.split(':'),tk=b.classList.contains('tick'),wd=!!b.closest('.done');if(n!=='sound')snd(tk?(wd?'undo':'ok'):/^t(next|back)$/.test(n)?'step':'tap');if(A[n](r.join(':'))===1)return;
  if(n==='cf'||n==='savegoal'||n==='saveact'||n==='doimp')closeSheet();
  render();if(tk&&!wd){const q=document.querySelector('[data-a="'+b.dataset.a+'"]');if(q&&q.closest('.done'))q.classList.add('pop');if(/^(step|hlog|sdone)$/.test(n))toast(CHEER[Math.floor(Math.random()*CHEER.length)])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('change',e=>{if(e.target.id==='fi'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('im').value=r.result};r.readAsText(e.target.files[0])}});
const _mascot=mascot;mascot=function(p){return S.quiet?'':_mascot(p)};
load();migrate();render();
