function migrate(){if(S.migrated)return;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^aimup/i.test(k))S.legacy[k]=localStorage.getItem(k)}}catch(e){}S.migrated=true;save()}

const CL=[['Version 0.96','Altitude is now simply goals finished. Ten ranks from Hatchling to Summit (1, 3, 6, 10, 15, 25, 40, 60 and 100 goals), a shield badge for each, and your rank number on the activity chip in the top bar. The rank card shows your progress to the next rank, and tapping it lists every rank plus your latest finished goals. A rank-up celebration shows your new badge. You keep your rank even if you reopen a goal, and ranks are never compared with anyone. (F24, F26)'],['Version 0.95','Home now opens with Today\u2019s step: the next action from your top aim and an I did it button that logs it on the goal timeline. Small coral dots on the Goals and Calendar tabs gently flag a goal not reviewed this week or a session today. The feedback flow offers tap-to-use starter goals for your activity. The TeenTech banner on Home can be hidden. Enter now submits forms, and ticks give a light buzz on phones that support it. (F3, F8, F10, F23, F27)'],['Version 0.94','Onboarding now animates in (logo, mascot, tiles) with far less text; comfort settings fold away. The tour intro now highlights the real boxes on the About screen instead of repeating them in the card. F numbers have an i button that explains each feature in plain words. The top bar shows the logo and name (from BRAND, or the logo set in Appearance) and a gear for settings, so the quick-add button sits in the centre of the bottom bar. Every screen starts with its title. The TeenTech banner and tour card are quieter, with the highlight outline now navy for contrast. (F22, F23, F28, F34, F34b, F36)'],['Version 0.92','Teen Tech demo release. Added the Concept lab (home-screen widgets, reminders, coach sharing, sync and dark theme as clearly labelled mock-ups using your real goals), a Teen Tech checklist that jumps into the tour, and new tour steps on research, privacy and each concept. No existing features removed.'],['Version 0.91','Current Aim bars redesigned: goal steps are now a segmented bar (one pill per step, with a count like 1/2 steps) and the week summary is its own labelled panel with a mint bar, so the two no longer read as one bar. The TeenTech tour now explains the project inside the tour card itself: the welcome, goal and vision, the seven aims, the six-step loop and every feature group, then each real screen with a short how-it-works note. (F34b, F37)'],['TeenTech tour and About screen','The tour is now the TeenTech tour. It opens with six steps that explain the project (the problem, goal, vision, aims, how it works and every feature) before walking through the real screens. The same content lives permanently in More, About Skybound and how it works. Progress bars were restyled: slimmer, with a highlight, turning mint when complete, and goal titles no longer show as grey boxes. (F34b, F37)'],['Mascot and celebrations','Ten mascot poses (hi, wave, happy, cheer, proud, wow, thinking, tired, sleep, sad) with reactions around the app: the greeting changes with the time and your week, tabs have their own pose, and tapping the mascot on a hint makes it react. Seven celebration screens: milestone, first time, goal complete, review done, altitude climb, personal best and weekly rhythm, each with its own look and sound. More, Mascot and celebrations lists every pose, takes a drop-in picture per pose and previews each celebration. (F25, F26)'],['Altitude rework','Altitude is now measured in metres and shows a named level, this week\u2019s climb and what is left to the next level. Tap the card for where your metres came from, the quickest climbs, recent climbs and what is up ahead. Practice is capped each day so tapping everything cannot inflate it. Onboarding now has accessibility settings (larger text, stronger contrast, reduce motion, sounds), and the extra reassurance lines are gone from the tour. (F24, F36)'],['Phase 7, feel','Page entrances, tick pop, progress fill, mascot hop, clean synthesised sounds with an on/off switch, and the mascot in onboarding, the tour and every main screen. Motion respects reduced-motion. (F25, F26)'],['Phase 7, tour','The TeenTech tour now takes you to each real screen, with the thing to look at highlighted. (F34b)'],['Phase 7, branding','All branding lives in one BRAND block: name, tagline, colours, font, logo, mascot poses, icons, activity tiles. Logo and mascot can also be dropped in from More, Appearance. (F28, F35)'],['Phase 7, more','Widget-style view and appearance settings: accent colour, font, corners, app name, logo style. (F33, F35)'],['Phase 6, progress report','Date range, choose content, preview, copy as text. Print is untested in a published page. (F20)'],['Phase 7, in progress','TeenTech tour, labelled example data, user guide, hidden developer guide, changelog, larger text, contrast fixes, first logo. (F34, F34b, F37, F36, F28)'],['Phase 5, personality','Mascot, celebrations, milestones, records, templates. (F12, F18, F19, F25, F26)'],['Phase 4, habits and organisation','Linked habits, weekly rhythm, calendar, history search, Altitude. (F15, F16, F17, F24)'],['Phase 3, goal follow-through','Next actions, success descriptions, reviews, timelines, carry-forward. (F5, F8 to F11)'],['Phase 2, core redesign','Home, goals, lesson-style feedback flow. (F1 to F4, F6, F7, F27)'],['Phase 1, rebrand and shell','Skybound name, palette, top and bottom bars, activity switcher, backup and restore, AimUp copy. (F21 to F23, F28 to F31)']];

const DG=['One self-contained file: vanilla HTML, CSS and JS. Data lives in localStorage under skybound.v1, with an in-memory fallback if storage is blocked.','State S: acts, goals, fb (feedback), ses (sessions), hab (habits), rec (records), ms (milestones), target, quiet, big, legacy. Every item except activities carries act, the id of its activity. Items with ex:1 are example data.','Actions: the A object. Any element with data-a="name:arg" calls A.name(arg), then render() runs unless the action returns 1.','Mascot: ten poses listed in MP (hi wave happy cheer proud wow thinking tired sleep sad). Fill BRAND.mascot, or add images per pose in More, Mascot and celebrations (S.ap.mascotPoses). A missing pose falls back through MFB to hi. The built-in bird is the BP, EY and BK tables plus mascot(), safe to delete. Celebrations: the CK table (milestone, first, goal, review, climb, record, week); call cele(kind,sub,title,x). Logo: the logo() function. Palette: CSS variables on :root.','AimUp migration: migrate() copies any localStorage key starting with aimup into S.legacy and never touches the originals. The real AimUp key names have not been checked, so legacy data is stored but not mapped into goals yet.','Altitude: rank per activity, from the number of finished goals only (alt() counts goals with a done time). RK holds the ranks and goal thresholds: 0, 1, 3, 6, 10, 15, 25, 40, 60, 100. The highest count is kept on the activity as peak, so reopening a goal never lowers a rank. The rank reached is remembered as rk to trigger the rank-up celebration. rankBadge(n,size) draws the badge. Ranks are personal and never compared.','Milestones are not awarded while only example data exists.','Appearance: S.ap holds acc, font, r, lg and name. applyAp() sets CSS variables and body classes on every render. The widget view is an in-app screen, not a native widget.','Branding: edit only the BRAND block at the top of the script. The logo, mascot poses, icons and activity tiles are dropins. Users can also drop in a logo or mascot image under More, Appearance (S.ap.logoImg, S.ap.mascotImg). The storage key skybound.v1 is not in BRAND on purpose. Feel: SND maps sound names to [Hz, delay, length] notes and BRAND.sounds overrides them. Every mascot moment calls mascot(pose), so a BRAND mascot replaces them all. TIPS holds the per-screen mascot tips. Tour: the TS array holds [title, text, navigate function, selector to highlight]. Add a step by adding a row. The tour adds a temporary example activity if needed and removes it at the end when you already had your own data. A few colours are still hard-coded: muted text, inactive tab icons, the built-in bird.'];

function aboutView(){const L=(a)=>a.map(x=>`<div class="line" style="align-items:flex-start"><span class="t"><b>${x[0]}</b><div class="muted" style="font-size:14px">${x[1]}</div></span></div>`).join('');
return `<div class="ab"><section class="card" id="ab-intro"><button class="btn ghost" data-a="sub:">Back</button><div style="display:grid;place-items:center;margin-top:14px">${logo(56)}</div><h2 style="text-align:center;margin-top:6px">${esc(nm())}</h2><p class="muted" style="text-align:center">${esc(BRAND.tagline)}</p><p style="margin-top:12px">${esc(nm())} is our TeenTech project, formerly called AimUp. It helps young people aged about 13 to 19 who do sports, music or other skill-based activities turn feedback from a coach, teacher or instructor into goals, actions and reviews, so feedback is never forgotten.</p><p class="muted" style="font-size:14px;margin-top:8px">It is not a commercial product: no ads, subscriptions or selling. It runs in the browser and keeps everything on your device.</p></section>
<section class="card" id="ab-problem"><h3>The problem</h3><p style="margin-top:6px">A coach says “use your weaker foot”. The player remembers for a day, has no plan, and arrives at the next session unsure what to focus on. Musicians, dancers and students have exactly the same problem with their teachers.</p></section>
<section class="card" id="ab-goal"><h3>Our goal</h3><p style="margin-top:6px">Never lose track of what you are working towards. ${esc(nm())} turns feedback into goals, and goals into visible progress.</p><h3 style="margin-top:16px">Our vision</h3><p style="margin-top:6px">A modern, youth-focused personal development app that connects feedback, goals, actions and reflection in one playful experience. It should feel like a friendly daily habit: organised, motivated and achievable, never like homework.</p><h3 style="margin-top:16px">Three questions it answers</h3>${L([['What am I trying to improve?','Your goals, each linked to the feedback behind it.'],['What can I do about it?','Your Current Aim, next actions, sessions and habits.'],['How have I progressed?','Reviews, history, personal bests, Altitude and progress reports.']])}</section>
<section class="card" id="ab-aims"><h3>Our aims</h3><p class="muted" style="font-size:14px;margin-top:4px">We build and test against these seven aims, and record the results in our TeenTech project log.</p><ol style="padding-left:22px;margin:10px 0 0">${AB_AIMS.map(a=>`<li style="margin:8px 0">${a}</li>`).join('')}</ol></section>
<section class="card" id="ab-how"><h3>How it works</h3><p class="muted" style="font-size:14px;margin-top:4px">A loop of six steps. Each one is a real screen in the app.</p>${AB_CYCLE.map((x,i)=>`<div class="line" style="align-items:flex-start"><b style="flex:none;width:30px;height:30px;border-radius:50%;background:var(--sky);display:grid;place-items:center">${i+1}</b><span class="t"><b>${x[0]}</b><div class="muted" style="font-size:14px">${x[1]}</div></span></div>`).join('')}</section>
<section class="card" id="ab-features"><h3>Every feature, explained</h3><p class="muted" style="font-size:14px;margin-top:4px">Tap a group to open it.</p>${AB_FEAT.map((g,i)=>`<details style="border-top:2px solid var(--cloud);padding:8px 0"${i===0?' open':''}><summary style="font-weight:900;font-size:17px;min-height:44px;display:flex;align-items:center;cursor:pointer">${g[0]}</summary>${L(g[1])}</details>`).join('')}</section>
<section class="card" id="ab-scope"><h3>Privacy and scope</h3><p style="margin-top:6px">${esc(nm())} is local-first and private by default. There are no accounts, public profiles or data collection, and nothing leaves your device unless you choose to export a backup. Clearing your browser data can remove your information, so back up now and then.</p><p class="muted" style="font-size:14px;margin-top:8px">Not part of this project: AI coaching, social feeds, leaderboards, streak counters, ads and subscriptions.</p></section>
<section class="card" id="ab-journey"><h3>Our journey</h3><p class="muted" style="font-size:14px;margin-top:4px">We chose the name ${esc(nm())} over AimUp in an informal vote of 41 people, 30 to 11. That is a small sample, not a formal study. The build ran in seven phases:</p>${AB_PH.map(x=>`<div class="line" style="align-items:flex-start"><span class="t"><b>${x[0]}</b><div class="muted" style="font-size:14px">${x[1]}</div></span></div>`).join('')}<p class="muted" style="font-size:14px;margin-top:10px">What is built, what is still being tested and what is only a concept is listed honestly in the guide.</p><div class="acts"><button class="btn ghost" data-a="sub:guide">Guide and changelog</button></div></section></div>`}
